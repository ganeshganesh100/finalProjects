<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FoodyX - Food Delivery</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#111;
    overflow-x:hidden;
}

/* ================= NAVBAR ================= */

header{
    position:fixed;
    top:0;
    width:100%;
    z-index:1000;
    backdrop-filter:blur(12px);
    background:rgba(0,0,0,0.35);
    border-bottom:1px solid rgba(255,255,255,0.1);
}

.navbar{
    max-width:1300px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 40px;
}

.logo{
    color:#fff;
    font-size:28px;
    font-weight:700;
}

.logo span{
    color:#ff7b00;
}

.nav-links{
    display:flex;
    gap:30px;
    list-style:none;
}

.nav-links a{
    color:white;
    text-decoration:none;
    transition:.3s;
}

.nav-links a:hover{
    color:#ff7b00;
}

/* ================= HERO ================= */

.hero{
    height:100vh;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    overflow:hidden;
}

.slider{
    position:absolute;
    width:100%;
    height:100%;
}

.slide{
    position:absolute;
    width:100%;
    height:100%;
    background-size:cover;
    background-position:center;
    opacity:0;
    transition:1s ease;
}

.slide.active{
    opacity:1;
}

.overlay{
    position:absolute;
    width:100%;
    height:100%;
    background:linear-gradient(
        rgba(0,0,0,.45),
        rgba(0,0,0,.75)
    );
}

.hero-content{
    position:relative;
    z-index:10;
    max-width:850px;
    padding:20px;
}

.tag{
    color:#ffb347;
    font-weight:600;
    letter-spacing:2px;
    margin-bottom:15px;
}

.hero-content h1{
    color:white;
    font-size:4rem;
    line-height:1.2;
    margin-bottom:20px;
}

.hero-content h1 span{
    color:#ff7b00;
}

.hero-content p{
    color:#ddd;
    font-size:1.1rem;
    margin-bottom:35px;
}

/* BUTTONS */

.hero-buttons{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

.btn{
    text-decoration:none;
    padding:14px 35px;
    border-radius:50px;
    font-weight:600;
    transition:.4s;
}

.btn-primary{
    background:linear-gradient(
        135deg,
        #ff7b00,
        #ff4d4d
    );
    color:white;
}

.btn-primary:hover{
    transform:translateY(-4px);
}

.btn-outline{
    border:2px solid white;
    color:white;
}

.btn-outline:hover{
    background:white;
    color:black;
}

/* SLIDER BUTTONS */

.arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    z-index:20;
    width:55px;
    height:55px;
    border:none;
    border-radius:50%;
    background:rgba(255,255,255,0.2);
    color:white;
    cursor:pointer;
    font-size:20px;
}

.arrow:hover{
    background:#ff7b00;
}

.prev{
    left:20px;
}

.next{
    right:20px;
}

/* RESPONSIVE */

@media(max-width:768px){

    .hero-content h1{
        font-size:2.6rem;
    }

    .nav-links{
        display:none;
    }
}
</style>
</head>
<body>

<header>
    <div class="navbar">
        <div class="logo">
            Foody<span>X</span>
        </div>

        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Menu</a></li>
            <li><a href="#">Offers</a></li>
            <li><a href="#">Contact</a></li>
            <li><a href="#"><i class="fas fa-shopping-cart"></i></a></li>
        </ul>
    </div>
</header>

<section class="hero">

    <div class="slider">

        <div class="slide active"
        style="background-image:url('assets/burger.jpg')"></div>

        <div class="slide"
        style="background-image:url('assets/pizza.jpg')"></div>

        <div class="slide"
        style="background-image:url('assets/chicken.jpg')"></div>

    </div>

    <div class="overlay"></div>

    <div class="hero-content">

        <p class="tag">FAST • FRESH • DELICIOUS</p>

        <h1>
            Delicious Food
            <span>Delivered Fast</span>
        </h1>

        <p>
            Order your favorite meals from top restaurants and
            get them delivered fresh to your doorstep in minutes.
        </p>

        <div class="hero-buttons">
            <a href="#" class="btn btn-primary">
                Order Now
            </a>

            <a href="#" class="btn btn-outline">
                View Menu
            </a>
        </div>

    </div>

    <button class="arrow prev">
        <i class="fas fa-chevron-left"></i>
    </button>

    <button class="arrow next">
        <i class="fas fa-chevron-right"></i>
    </button>

</section>

<script>
const slides = document.querySelectorAll(".slide");
const next = document.querySelector(".next");
const prev = document.querySelector(".prev");

let current = 0;

function showSlide(index){
    slides.forEach(slide =>
        slide.classList.remove("active")
    );

    slides[index].classList.add("active");
}

next.addEventListener("click", () => {
    current = (current + 1) % slides.length;
    showSlide(current);
});

prev.addEventListener("click", () => {
    current = (current - 1 + slides.length) % slides.length;
    showSlide(current);
});

setInterval(() => {
    current = (current + 1) % slides.length;
    showSlide(current);
}, 5000);
</script>

</body>
</html>
